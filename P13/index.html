<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox or Grid?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Flexbox or Grid?</h1>
    <p>This page uses Grid for the overall comparison and Flexbox for the small navigation row.</p>
    <nav aria-label="Examples"><a href="#flex">Flexbox</a><a href="#grid">Grid</a></nav>
    <section id="flex">
      <h2>Flexbox example</h2>
      <div class="flex-list"><article>Navigation item one</article><article>Navigation item two</article><article>Navigation item three</article></div>
    </section>
    <section id="grid">
      <h2>Grid example</h2>
      <div class="grid-list"><article>Project one</article><article>Project two</article><article>Project three</article><article>Project four</article></div>
    </section>
  </main>
</body>
</html>
